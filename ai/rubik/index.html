<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0814">
<title>魔方实验室 · RUBIK LAB — 能玩 · 能学 · 能看懂原理</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26">
          <g fill="none" stroke-width="1.6">
            <path d="M16 3 28 9.5v13L16 29 4 22.5v-13Z" stroke="#7C5CFF"/>
            <path d="M16 3v13m0 0L4 9.5M16 16l12-6.5M16 16v13" stroke="#22E3FF" opacity=".85"/>
            <circle cx="16" cy="16" r="2.4" fill="#FF2D9B" stroke="none"/>
          </g>
        </svg>
      </span>
      <span class="brand-text"><b>魔方实验室</b><i>RUBIK&nbsp;LAB</i></span>
    </div>

    <nav class="modes" id="modes" aria-label="模式">
      <button class="mode active" data-mode="play"><span class="mk">1</span><span class="ml">玩</span><em>PLAY</em></button>
      <button class="mode" data-mode="tutorial"><span class="mk">2</span><span class="ml">学</span><em>TUTOR</em></button>
      <button class="mode" data-mode="mechanism"><span class="mk">3</span><span class="ml">拆</span><em>MECH</em></button>
      <button class="mode" data-mode="math"><span class="mk">4</span><span class="ml">理</span><em>MATH</em></button>
    </nav>

    <div class="top-right">
      <div class="seg" id="orderSwitch" role="group" aria-label="阶数">
        <button data-n="2">2×2</button><button data-n="3" class="active">3×3</button>
      </div>
      <button id="soundBtn" class="icon-btn on" title="声音开关 (S)" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="18" height="18" class="i-on"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" fill="none" stroke-width="1.7" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" width="18" height="18" class="i-off"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M17 9.5l5 5m0-5l-5 5" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="sr">声音</span>
      </button>
      <button id="helpBtn" class="icon-btn" title="操作说明 (H)">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="17" r="1.05" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <aside class="dock left" id="leftDock" aria-label="控制台">
    <div class="dock-head">
      <h2>控制台</h2><span class="dock-sub">CONTROL DECK · 实时生效</span>
    </div>
    <div class="dock-scroll" id="leftScroll">

      <section class="ctl-group">
        <h3><i class="dot" style="--c:var(--magenta)"></i>动作</h3>
        <div class="btn-grid">
          <button class="btn primary" id="btnScramble">打乱 <kbd>Space</kbd></button>
          <button class="btn" id="btnRewind">回溯还原 <kbd>⌫</kbd></button>
          <button class="btn accent" id="btnTeach">教程求解 <kbd>↵</kbd></button>
          <button class="btn ghost" id="btnReset">重置 <kbd>0</kbd></button>
        </div>
        <div class="btn-grid two">
          <button class="btn ghost" id="btnRandomPal">随机配色</button>
          <button class="btn ghost" id="btnUndo">撤销一步</button>
        </div>
      </section>

      <section class="ctl-group">
        <h3><i class="dot" style="--c:var(--cyan)"></i>转动</h3>
        <label class="ctl"><span>转动速度<b id="vSpeed">1.00×</b></span>
          <input type="range" id="rSpeed" min="0.25" max="3" step="0.05" value="1"></label>
        <label class="ctl"><span>缓动曲线</span>
          <select id="sEasing">
            <option value="outCubic">Out Cubic · 干脆</option>
            <option value="inOutQuart">In-Out Quart · 顺滑</option>
            <option value="smooth">Smoothstep · 柔和</option>
            <option value="outBack">Out Back · 回弹</option>
            <option value="outElastic">Out Elastic · 弹性</option>
            <option value="linear">Linear · 匀速</option>
          </select></label>
        <label class="ctl"><span>连续转动间隔<b id="vGap2">0 ms</b></span>
          <input type="range" id="rTurnGap" min="0" max="240" step="10" value="0"></label>
      </section>

      <section class="ctl-group">
        <h3><i class="dot" style="--c:var(--acid)"></i>形体 / 拆解</h3>
        <label class="ctl"><span>块间距<b id="vGap">0.00</b></span>
          <input type="range" id="rGap" min="0" max="0.4" step="0.01" value="0"></label>
        <label class="ctl"><span>爆炸拆解<b id="vExplode">0.00</b></span>
          <input type="range" id="rExplode" min="0" max="1" step="0.01" value="0"></label>
        <label class="ctl"><span>外壳透明 (X-Ray)<b id="vXray">0.00</b></span>
          <input type="range" id="rXray" min="0" max="1" step="0.01" value="0"></label>
        <label class="ctl row"><span>剖切平面</span>
          <button class="toggle" id="tCut" aria-pressed="false"><i></i></button></label>
        <label class="ctl"><span>剖切位置<b id="vCut">0.00</b></span>
          <input type="range" id="rCut" min="-1.8" max="1.8" step="0.02" value="0"></label>
        <label class="ctl"><span>倒角半径<b id="vRadius">0.09</b></span>
          <input type="range" id="rRadius" min="0.02" max="0.22" step="0.01" value="0.09"></label>
      </section>

      <section class="ctl-group">
        <h3><i class="dot" style="--c:var(--amber)"></i>光影 / 氛围</h3>
        <label class="ctl"><span>主光强度<b id="vLight">1.00</b></span>
          <input type="range" id="rLight" min="0.15" max="2.2" step="0.05" value="1"></label>
        <label class="ctl"><span>主光方位<b id="vLightAngle">52°</b></span>
          <input type="range" id="rLightAngle" min="0" max="6.28" step="0.02" value="0.9"></label>
        <label class="ctl"><span>辉光 Bloom<b id="vBloom">0.50</b></span>
          <input type="range" id="rBloom" min="0" max="1.6" step="0.02" value="0.5"></label>
        <label class="ctl"><span>贴纸自发光<b id="vGlow">1.00</b></span>
          <input type="range" id="rGlow" min="0" max="2.4" step="0.05" value="1"></label>
        <label class="ctl"><span>雾浓度<b id="vFog">0.028</b></span>
          <input type="range" id="rFog" min="0" max="0.09" step="0.002" value="0.028"></label>
        <label class="ctl"><span>浮尘粒子<b id="vParticles">620</b></span>
          <input type="range" id="rParticles" min="0" max="1600" step="20" value="620"></label>
      </section>

      <section class="ctl-group">
        <h3><i class="dot" style="--c:var(--blue)"></i>视角</h3>
        <label class="ctl"><span>相机距离<b id="vDist">9.6</b></span>
          <input type="range" id="rDist" min="4.2" max="20" step="0.1" value="9.6"></label>
        <label class="ctl row"><span>自动环绕</span>
          <button class="toggle" id="tAuto" aria-pressed="false"><i></i></button></label>
        <div class="chip-row" id="camPresets">
          <button data-cam="iso" class="chip-btn active">等轴</button>
          <button data-cam="front" class="chip-btn">正面</button>
          <button data-cam="top" class="chip-btn">顶面</button>
          <button data-cam="corner" class="chip-btn">角视</button>
          <button data-cam="side" class="chip-btn">侧视</button>
          <button data-cam="low" class="chip-btn">仰视</button>
        </div>
      </section>

      <section class="ctl-group">
        <h3><i class="dot" style="--c:var(--violet)"></i>显示</h3>
        <label class="ctl"><span>配色主题</span>
          <select id="sPalette"></select></label>
        <label class="ctl"><span>渲染质量</span>
          <select id="sQuality">
            <option value="high">高 · 辉光 + 阴影</option>
            <option value="medium">中 · 辉光</option>
            <option value="low">低 · 省电</option>
          </select></label>
        <label class="ctl row"><span>线框模式</span>
          <button class="toggle" id="tWire" aria-pressed="false"><i></i></button></label>
        <label class="ctl row"><span>地面网格</span>
          <button class="toggle on" id="tGrid" aria-pressed="true"><i></i></button></label>
        <label class="ctl row"><span>环境音</span>
          <button class="toggle on" id="tAmbient" aria-pressed="true"><i></i></button></label>
      </section>

      <section class="ctl-group">
        <h3><i class="dot" style="--c:var(--warm)"></i>导出</h3>
        <div class="btn-grid two">
          <button class="btn ghost" id="btnPng">保存 PNG</button>
          <button class="btn ghost" id="btnJson">导出状态</button>
        </div>
        <button class="btn ghost wide" id="btnCopyScramble">复制当前打乱公式</button>
      </section>
    </div>
  </aside>

  <main class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div class="hud-top">
      <div class="chip status" id="statusChip"><i></i><span>已复原</span></div>
      <div class="chip mono" id="scrambleChip" title="当前打乱公式">—</div>
      <div class="chip mono" id="timerChip">00:00.0</div>
    </div>

    <div class="big-notation" id="bigNotation" aria-live="polite"></div>
    <div class="labels" id="labels"></div>

    <div class="hud-bottom">
      <div class="hint" id="stageHint">拖拽空白处旋转视角 · 在魔方表面滑动即可转层 · 滚轮缩放</div>
      <div class="progress-ring" id="solveRing" title="复原进度">
        <svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="18"/><circle class="fg" cx="22" cy="22" r="18"/></svg>
        <span id="ringPct">100%</span>
      </div>
    </div>

    <div class="loader" id="loader"><div class="lcube"><i></i><i></i><i></i></div><p id="loaderText">正在装配魔方…</p></div>
  </main>

  <aside class="dock right" id="rightDock" aria-label="信息面板">
    <div class="dock-head">
      <h2 id="rightTitle">状态</h2><span class="dock-sub" id="rightSub">STATUS</span>
    </div>
    <div class="dock-scroll" id="rightScroll">
      <div class="panel" data-panel="play" id="panelPlay"></div>
      <div class="panel" data-panel="tutorial" id="panelTutorial" hidden></div>
      <div class="panel" data-panel="mechanism" id="panelMechanism" hidden></div>
      <div class="panel" data-panel="math" id="panelMath" hidden></div>
    </div>
  </aside>

  <footer class="movebar">
    <div class="alg-entry">
      <input id="algInput" placeholder="输入公式 R U R' U' …" spellcheck="false" autocomplete="off">
      <button class="btn tiny" id="algRun">执行</button>
    </div>
    <div class="history" id="history" aria-label="动作历史"></div>
    <div class="movebar-right">
      <span class="mono" id="moveCount">0 步</span>
      <button class="btn tiny ghost" id="undoBtn">撤销</button>
    </div>
  </footer>
</div>

<div class="modal" id="helpModal" hidden>
  <div class="modal-card">
    <button class="modal-close" id="helpClose" aria-label="关闭">×</button>
    <h2>操作说明</h2>
    <p class="modal-lead">鼠标、触控板、键盘、触屏都能完整操控：转视角、转层、还原。</p>
    <div class="help-grid" id="helpGrid"></div>
    <div class="modal-foot">按 <kbd>H</kbd> 或 <kbd>Esc</kbd> 关闭</div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.bundle.js"></script>
</body>
</html>
