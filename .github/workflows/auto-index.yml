name: Auto Update Index

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'ai/**'
      - 'scripts/update-index.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan ai/ and update index.html
        run: node scripts/update-index.mjs

      - name: Commit and push if index.html changed
        run: |
          if git diff --quiet index.html; then
            echo "index.html 无变更，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: auto-link new pages in index.html [skip ci]"
          git push
